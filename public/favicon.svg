<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .bg { fill: #0D0E12; }
    .border { stroke: rgba(255, 255, 255, 0.14); }
    .text { fill: #FFFFFF; }
    .dot { fill: #6C63FF; }
    @media (prefers-color-scheme: light) {
      .bg { fill: #F8F9FA; }
      .border { stroke: rgba(0, 0, 0, 0.12); }
      .text { fill: #111216; }
      .dot { fill: #6C63FF; }
    }
  </style>
  <rect class="bg" width="32" height="32" rx="7" />
  <rect class="border" x="0.5" y="0.5" width="31" height="31" rx="6.5" fill="none" stroke-width="1" />
  <text 
    x="16" 
    y="21" 
    class="text"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
    font-size="12" 
    font-weight="800" 
    letter-spacing="-0.3px" 
    text-anchor="middle"
  >MR<tspan class="dot">.</tspan></text>
</svg>